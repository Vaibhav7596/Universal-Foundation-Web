<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- DYNAMIC_OG_META_START -->
  <title>Universal Foundation — Blog Stories & Field Updates</title>
  <meta name="title" content="Universal Foundation — Blog Stories & Field Updates">
  <meta name="description" content="Discover inspiring stories, field updates, disaster response insights, and community initiatives from Universal Foundation.">
  <link rel="canonical" href="https://universalfoundationindia.com/blog.html">

  <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Universal Foundation">
  <meta property="og:url" content="https://universalfoundationindia.com/blog.html">
  <meta property="og:title" content="Universal Foundation — Blog Stories & Field Updates">
  <meta property="og:description" content="Discover inspiring stories, field updates, disaster response insights, and community initiatives from Universal Foundation.">
  <meta property="og:image" content="https://universalfoundationindia.com/images/logo.jpeg">
  <meta property="og:image:secure_url" content="https://universalfoundationindia.com/images/logo.jpeg">
  <meta property="og:image:alt" content="Universal Foundation">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://universalfoundationindia.com/blog.html">
  <meta name="twitter:title" content="Universal Foundation — Blog Stories & Field Updates">
  <meta name="twitter:description" content="Discover inspiring stories, field updates, disaster response insights, and community initiatives from Universal Foundation.">
  <meta name="twitter:image" content="https://universalfoundationindia.com/images/logo.jpeg">
  <!-- DYNAMIC_OG_META_END -->
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Premium Single Blog Post Page Styles */
    .article-wrap {
      max-width: 820px;
      margin: -60px auto 96px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--earth-stone);
      box-shadow: var(--shadow-mid);
      padding: 60px;
      position: relative;
      z-index: 10;
    }
    
    .article-hero {
      height: 480px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 60px;
      color: var(--white);
    }
    .article-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(26,58,42,0.92) 0%, rgba(26,58,42,0.4) 60%, transparent 100%);
      z-index: 1;
    }
    .article-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85);
    }
    .article-hero-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }
    
    .article-meta-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .article-category {
      background: var(--green-soft);
      color: var(--green-deep);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .article-date {
      font-size: 0.85rem;
      color: rgba(253,250,246,0.85);
    }
    
    .article-hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.2;
      color: var(--white);
      margin: 0;
    }
    
    .article-body {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--ink-mid);
    }
    .article-body p {
      margin-bottom: 24px;
      font-weight: 300;
    }
    .article-body h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--green-deep);
      margin: 36px 0 16px;
      line-height: 1.3;
    }
    .article-body h3::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      background: var(--green-soft);
      margin-top: 8px;
    }
    .article-body blockquote {
      border-left: 4px solid var(--green-soft);
      background: var(--earth-sand);
      padding: 20px 28px;
      font-style: italic;
      font-size: 1.1rem;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin: 32px 0;
      color: var(--green-deep);
    }
    .article-body ul, .article-body ol {
      margin: 20px 0 28px 24px;
    }
    .article-body li {
      margin-bottom: 8px;
      font-weight: 300;
    }
    
    .article-footer {
      border-top: 1px solid var(--earth-stone);
      padding-top: 36px;
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .article-share {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .article-share-label {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-light);
    }
    .share-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .share-btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }
    .share-wa { background: #25D366; }
    .share-fb { background: #1877F2; }
    .share-tw { background: #1DA1F2; }
    .share-li { background: #0A66C2; }
    .share-copy { background: var(--green-deep); border: none; cursor: pointer; }
    .share-copy.copied { background: #10b981; }
    
    .error-wrap {
      text-align: center;
      padding: 96px 24px;
    }
    
    @media (max-width: 768px) {
      .article-hero {
        height: 380px;
        padding: 30px;
      }
      .article-wrap {
        margin: -40px 20px 64px;
        padding: 32px 24px;
        border-radius: var(--radius-md);
      }
      .article-footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<header>
  <a class="logo" href="index.html">
    <img class="dynamic-logo" src="images/logo.jpeg" alt="Universal Foundation">
    <span class="dynamic-brand">Universal Foundation</span>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="work.html">Our Work</a>
    <a href="events.html">Internship</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
    <a href="donate.html" class="nav-donate" style="color:var(--green-soft); font-weight:700;">Support Us</a>
  </nav>
  <button class="mobile-menu-toggle" aria-label="Toggle Navigation">
    <i class="fa-solid fa-bars"></i>
  </button>
</header>

<!-- DYNAMIC POST CONTENT WRAPPER -->
<div id="article-page-container">
  <div style="text-align:center; padding: 120px 24px;">
    <div class="spinner" style="margin: 0 auto; border-top-color: var(--green-mid);"></div>
    <p style="margin-top: 15px; color: var(--ink-light);">Fetching your article...</p>
  </div>
</div>

<footer>
  <div class="footer-brand dynamic-brand">Universal Foundation</div>
  <p>© 2026 <span class="dynamic-brand">Universal Foundation</span> · Surat, Gujarat</p>
  <p><a href="mailto:hellouniversalfoundation@gmail.com" class="dynamic-email">hellouniversalfoundation@gmail.com</a></p>
</footer>

<a href="https://wa.me/918347807007" class="wa-float dynamic-wa-link">
  <i class="fa-brands fa-whatsapp" style="font-size:1.1rem;"></i> WhatsApp
</a>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>AOS.init({ duration: 800, once: true, offset: 60 });</script>
<script src="js/script.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Parse slug/id from query params or pathname
    const params = new URLSearchParams(window.location.search);
    let slug = params.get('slug') || params.get('id');
    if (!slug) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if ((parts[0] === 'blog' || parts[0] === 'blog-post') && parts[1]) {
        slug = parts[1];
      }
    }
    
    const pageContainer = document.getElementById('article-page-container');
    if (!pageContainer) return;
    
    if (!slug) {
      renderError("No Article Specified", "Please navigate back to the blog list and select an article to read.");
      return;
    }

    function renderArticle(blog) {
      document.title = `${blog.title} — Universal Foundation`;
      
      // Build dynamic share links using canonical URL with slug
      const canonicalUrl = `${window.location.origin}/blog-post.html?slug=${encodeURIComponent(blog.slug || blog.id)}`;
      const shareUrl = encodeURIComponent(canonicalUrl);
      const shareText = encodeURIComponent(`Check out this story from Universal Foundation: ${blog.title}`);
      
      pageContainer.innerHTML = `
        <!-- ARTICLE BANNER -->
        <div class="article-hero" data-aos="fade-down">
          <img class="article-hero-bg" src="${blog.image}" alt="${blog.title}">
          <div class="article-hero-content">
            <div class="article-meta-top">
              <span class="article-category">${blog.category}</span>
              <span class="article-date">${blog.date}</span>
            </div>
            <h1>${blog.title}</h1>
          </div>
        </div>
        
        <!-- ARTICLE CONTENT -->
        <article class="container" style="position:relative;" data-aos="fade-up">
          <div class="article-wrap">
            <div class="article-body">
              ${blog.content}
            </div>
            
            <div class="article-footer">
              <a href="blog.html" class="btn btn-ghost" style="font-size:0.85rem; padding:10px 20px; display:inline-flex; align-items:center; gap:8px;">
                <i class="fa fa-arrow-left" style="font-size:0.75rem;"></i> Back to Blog
              </a>
              
              <div class="article-share">
                <span class="article-share-label">Share:</span>
                <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn share-wa" aria-label="Share on WhatsApp" title="Share on WhatsApp">
                  <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}" target="_blank" class="share-btn share-li" aria-label="Share on LinkedIn" title="Share on LinkedIn">
                  <i class="fa-brands fa-linkedin-in"></i>
                </a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn share-fb" aria-label="Share on Facebook" title="Share on Facebook">
                  <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn share-tw" aria-label="Share on Twitter" title="Share on Twitter">
                  <i class="fa-brands fa-twitter"></i>
                </a>
                <button type="button" class="share-btn share-copy" id="btn-copy-link" aria-label="Copy Blog Link" title="Copy Blog Link">
                  <i class="fa-solid fa-link" id="copy-icon"></i>
                </button>
              </div>
            </div>
          </div>
        </article>
      `;

      // Copy Link button event listener
      const copyBtn = document.getElementById('btn-copy-link');
      const copyIcon = document.getElementById('copy-icon');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(canonicalUrl).then(() => {
              copyBtn.classList.add('copied');
              if (copyIcon) copyIcon.className = 'fa-solid fa-check';
              setTimeout(() => {
                copyBtn.classList.remove('copied');
                if (copyIcon) copyIcon.className = 'fa-solid fa-link';
              }, 2000);
            }).catch(() => {
              prompt('Copy this link:', canonicalUrl);
            });
          } else {
            prompt('Copy this link:', canonicalUrl);
          }
        });
      }
      
      // Re-initialize AOS for fresh markup
      if (typeof AOS !== 'undefined') {
        AOS.refresh();
      }
    }
    
    // Check if initial blog data was pre-injected server-side
    if (window.__INITIAL_BLOG__ && (window.__INITIAL_BLOG__.slug === slug || window.__INITIAL_BLOG__.id === slug)) {
      renderArticle(window.__INITIAL_BLOG__);
    } else {
      // Fetch detailed article
      fetch(`/api/public/blogs/${slug}`)
        .then(res => {
          if (!res.ok) throw new Error("Article not found");
          return res.json();
        })
        .then(blog => renderArticle(blog))
        .catch(err => {
          console.error('Error fetching blog post:', err);
          renderError("Article Not Found", "The article you are trying to view does not exist or has been deleted by our site administrator.");
        });
    }
      
    function renderError(title, msg) {
      document.title = `Article Not Found — Universal Foundation`;
      pageContainer.innerHTML = `
        <div class="container error-wrap" data-aos="fade-up">
          <div style="background:var(--earth-sand); border-radius:var(--radius-lg); border:1px solid var(--earth-stone); padding:64px 48px; max-width:600px; margin:0 auto; box-shadow:var(--shadow-soft);">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem; color:var(--earth-warm); margin-bottom:20px;"></i>
            <h2 style="font-family:'DM Serif Display',serif; color:var(--green-deep); margin-bottom:12px;">${title}</h2>
            <p style="color:var(--ink-light); font-weight:300; line-height:1.6; margin-bottom:28px;">${msg}</p>
            <a href="blog.html" class="btn btn-primary">
              <i class="fa fa-arrow-left" style="margin-right:6px;"></i> Return to Blogs
            </a>
          </div>
        </div>
      `;
    }
  });
</script>
</body>
</html>
