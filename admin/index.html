<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Universal Foundation CMS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Clean luxury styling for Admin Login */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--green-deep) 0%, #0d2016 100%);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(82,183,136,0.12) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    
    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(45,106,79,0.08) 0%, transparent 70%);
      bottom: -200px;
      left: -200px;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      z-index: 10;
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .login-logo img {
      height: 56px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .login-logo span {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      padding: 44px 40px;
      backdrop-filter: blur(10px);
    }

    .login-header {
      margin-bottom: 28px;
    }
    .login-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--green-deep);
      margin-bottom: 8px;
    }
    .login-header p {
      color: var(--ink-light);
      font-size: 0.88rem;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }
    
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--green-deep);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-light);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .input-wrapper input {
      padding-left: 44px;
      background: var(--white);
      border: 1.5px solid var(--earth-stone);
      height: 48px;
      transition: var(--transition);
    }

    .input-wrapper input:focus {
      border-color: var(--green-soft);
      box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
    }
    
    .input-wrapper input:focus + i {
      color: var(--green-mid);
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      margin-top: 12px;
      border-radius: var(--radius-sm);
    }
    
    .error-banner {
      background: #fdf2f2;
      border: 1px solid #fde8e8;
      border-radius: var(--radius-sm);
      color: #9b1c1c;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
    }
    .login-footer a {
      color: rgba(253,250,246,0.65);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .login-footer a:hover {
      color: var(--green-soft);
    }
  </style>
</head>
<body>

<div class="login-container">
  <a class="login-logo" href="../index.html">
    <img src="../images/logo.jpeg" alt="Universal Foundation">
    <span>Universal Foundation</span>
  </a>

  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your NGO website content securely.</p>
    </div>

    <!-- Error message display -->
    <div class="error-banner" id="error-box">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="error-message">Invalid credentials. Please try again.</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="Enter username" required>
          <i class="fa-solid fa-user"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-submit" id="submit-btn">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </button>
    </form>
  </div>

  <div class="login-footer">
    <a href="../index.html">
      <i class="fa-solid fa-arrow-left"></i> Back to Homepage
    </a>
  </div>
</div>

<script>
  // Check if already authenticated and redirect instantly
  fetch('/api/auth/check')
    .then(res => res.json())
    .then(data => {
      if (data.authenticated) {
        window.location.href = 'dashboard.html';
      }
    });

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const errorMessage = document.getElementById('error-message');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    // Reset state
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    const btnText = submitBtn.querySelector('span');
    const btnIcon = submitBtn.querySelector('i');
    
    btnText.textContent = 'Verifying...';
    btnIcon.className = 'fa-solid fa-circle-notch fa-spin';
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(res => {
      if (!res.ok) {
        return res.json().then(data => { throw new Error(data.error || 'Authentication failed') });
      }
      return res.json();
    })
    .then(data => {
      // Login successful, redirect
      window.location.href = 'dashboard.html';
    })
    .catch(err => {
      console.error(err);
      errorMessage.textContent = err.message || 'Invalid username or password.';
      errorBox.style.display = 'flex';
      
      // Reset button
      submitBtn.disabled = false;
      btnText.textContent = 'Sign In';
      btnIcon.className = 'fa-solid fa-arrow-right-to-bracket';
    });
  });
</script>
</body>
</html>
